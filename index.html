<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#242424"><title>Timer Funcional</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#242424;color:white;font-family:Impact,"Arial Narrow",system-ui,sans-serif;text-align:center}header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:#242424;color:#ffff35}header strong{font-size:24px}button{cursor:pointer;border:0} .gear{background:transparent;color:#ffff35;font-size:28px}.stage{background:#ffff35;color:#000;padding:20px 8px 14px;transition:background .15s}.stage h1{font-size:clamp(34px,7vw,64px);margin:0}.clock{font-size:clamp(105px,26vw,330px);font-weight:900;line-height:1.25;letter-spacing:-.065em;font-variant-numeric:tabular-nums}.next{background:#99ff36;color:black;padding:12px}.next div{font-size:clamp(60px,12vw,120px);font-weight:900;line-height:1.1}.next span{font-size:24px}.bottom{display:flex;align-items:center;justify-content:space-around;gap:8px;padding:35px 8px}.stat{width:30%}.stat b{display:block;font-size:clamp(60px,14vw,145px);line-height:1;color:#42b3e8}.stat:last-child b{color:#ffff35}.stat small{display:block;font-size:clamp(11px,2.2vw,22px);margin-top:12px}.play{background:#ffff35;border:7px solid #ffff35;box-shadow:inset 0 0 0 4px #242424;border-radius:50%;width:clamp(95px,23vw,220px);height:clamp(95px,23vw,220px);font-size:clamp(42px,9vw,80px);color:#242424}.controls{display:flex;justify-content:center;gap:18px;margin:0 0 20px}.controls button,.settings button{padding:12px 18px;border-radius:10px;font-size:17px}.controls button{background:#444;color:white}.settings{display:none;background:#343434;padding:20px;margin:10px auto;max-width:550px;border-radius:12px}.settings.open{display:block}.settings h2{margin-top:0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:left}.fields label{font-family:Arial,sans-serif;font-size:14px}.fields input{display:block;width:100%;padding:10px;font-size:20px;margin-top:5px;border-radius:6px;border:0}.settings button{background:#ffff35;margin-top:20px;font-weight:bold}.hint{font:13px Arial,sans-serif;color:#bbb;padding:0 15px 20px;line-height:1.5}@media(max-width:550px){.bottom{padding:30px 5px}.clock{font-size:25vw}.stage{padding:30px 6px}.next{padding:15px 6px}}
</style></head><body><header><button class="gear" id="config" aria-label="Configurações">⚙</button><div><strong>TABATA / FUNCIONAL</strong><div id="total">00:00</div></div><button class="gear" id="resetTop" aria-label="Reiniciar">↻</button></header>
<section class="settings" id="settings"><h2>CONFIGURAÇÕES</h2><div class="fields">
<label>Preparação (seg)<input id="prep" type="number" min="0" max="3600" value="10"></label>
<label>Exercício (seg)<input id="work" type="number" min="1" max="3600" value="38"></label>
<label>Troca (seg)<input id="change" type="number" min="0" max="3600" value="10"></label>
<label>Descanso entre rondas (seg)<input id="rest" type="number" min="0" max="3600" value="60"></label>
<label>Exercícios por ronda<input id="rounds" type="number" min="1" max="100" value="7"></label>
<label>Ciclos<input id="cycles" type="number" min="1" max="100" value="4"></label>
</div><p><label style="font-family:Arial"><input type="checkbox" id="voice" checked> Ativar voz em português</label></p><button id="save">SALVAR E REINICIAR</button></section>
<section class="stage" id="stage"><h1 id="phase">PREPARAR</h1><div class="clock" id="clock">00:10</div></section><section class="next"><span id="nextLabel">EXERCÍCIO</span><div id="nextTime">00:38</div></section>
<section class="bottom"><div class="stat"><b id="roundLeft">7</b><small>EXERCÍCIOS PARA TERMINAR</small></div><button class="play" id="play" aria-label="Iniciar ou pausar">▶</button><div class="stat"><b id="cycleLeft">4</b><small>CICLOS PARA TERMINAR</small></div></section>
<div class="controls"><button id="reset">↻ Reiniciar</button><button id="sound">🔔 Testar ring</button></div><p class="hint">A voz usa a síntese de fala do aparelho. No iPhone/iPad, toque em Iniciar para liberar o áudio. Mantenha o Safari aberto e a tela ativa durante o treino.</p>
<script>
const $=id=>document.getElementById(id), ids=['prep','work','change','rest','rounds','cycles'];let cfg={},steps=[],idx=0,remaining=10,playing=false,endAt=0,tick=null,audio=null;
function getCfg(){let c={};ids.forEach(id=>c[id]=Math.max(id==='work'||id==='rounds'||id==='cycles'?1:0,Math.min(3600,Number($(id).value)||0)));return c}
function makeSteps(){steps=[];if(cfg.prep)steps.push({type:'PREPARAR',secs:cfg.prep});for(let c=0;c<cfg.cycles;c++){for(let r=0;r<cfg.rounds;r++){steps.push({type:'EXERCÍCIO',secs:cfg.work,c,r});if(r<cfg.rounds-1&&cfg.change)steps.push({type:'TROCA',secs:cfg.change,c,r})}if(c<cfg.cycles-1&&cfg.rest)steps.push({type:'DESCANSO',secs:cfg.rest,c,r:cfg.rounds-1})}steps.push({type:'FINALIZADO',secs:0,c:cfg.cycles,r:0})}
function fmt(n){n=Math.max(0,Math.ceil(n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function setup(){if('speechSynthesis' in window)speechSynthesis.cancel();playing=false;clearInterval(tick);cfg=getCfg();makeSteps();idx=0;remaining=steps[0].secs;$('play').textContent='▶';render()}
function render(){let s=steps[idx],n=steps[idx+1];$('phase').textContent=s.type;$('clock').textContent=fmt(remaining);$('nextLabel').textContent=n?n.type:'FIM';$('nextTime').textContent=n?fmt(n.secs):'00:00';let color={'PREPARAR':'#ffff35','EXERCÍCIO':'#99ff36','TROCA':'#42b3e8','DESCANSO':'#ff9f3e','FINALIZADO':'#ffff35'}[s.type];$('stage').style.background=color;let c=s.c??0,r=s.r??0;$('roundLeft').textContent=s.type==='FINALIZADO'?0:cfg.rounds-r;$('cycleLeft').textContent=s.type==='FINALIZADO'?0:cfg.cycles-c;let total=remaining+steps.slice(idx+1).reduce((a,x)=>a+x.secs,0);$('total').textContent=fmt(total)}
function unlock(){try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}}
function ring(){if(!audio)return;let t=audio.currentTime;[0,.18,.36].forEach((delay,i)=>{let osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.setValueAtTime(i===1?900:1200,t+delay);gain.gain.setValueAtTime(.0001,t+delay);gain.gain.exponentialRampToValueAtTime(.25,t+delay+.015);gain.gain.exponentialRampToValueAtTime(.0001,t+delay+.42);osc.connect(gain).connect(audio.destination);osc.start(t+delay);osc.stop(t+delay+.43)})}
function speak(phrase){if(!$('voice').checked||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(phrase);u.lang='pt-BR';u.rate=1.1;u.volume=1;speechSynthesis.speak(u)}catch(e){}}
function announce(){let type=steps[idx].type;let phrase={'PREPARAR':'Preparar','EXERCÍCIO':'Começar','TROCA':'Trocar exercício','DESCANSO':'Descansar','FINALIZADO':'Treino finalizado'}[type];if(phrase)speak(phrase)}
function advance(){ring();idx++;announce();if(idx>=steps.length){idx=steps.length-1;playing=false;clearInterval(tick);return}remaining=steps[idx].secs;if(steps[idx].type==='FINALIZADO'){playing=false;clearInterval(tick);$('play').textContent='▶'}else endAt=performance.now()+remaining*1000}
function update(){if(!playing)return;let now=performance.now();while(playing&&now>=endAt&&idx<steps.length-1){advance();now=performance.now()}if(playing)remaining=Math.max(0,Math.ceil((endAt-now)/1000));render()}
$('play').onclick=()=>{unlock();if(steps[idx].type==='FINALIZADO')setup();playing=!playing;$('play').textContent=playing?'Ⅱ':'▶';if(playing){announce();endAt=performance.now()+remaining*1000;tick=setInterval(update,100)}else{remaining=Math.max(0,Math.ceil((endAt-performance.now())/1000));clearInterval(tick)}render()};
$('reset').onclick=$('resetTop').onclick=setup;$('sound').onclick=()=>{unlock();ring();speak('Preparar. Começar. Trocar exercício. Descansar.')};$('config').onclick=()=>$('settings').classList.toggle('open');$('save').onclick=()=>{setup();$('settings').classList.remove('open')};setup();
</script></body></html>
